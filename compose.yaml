services:
  app:
    build: .
    restart: always
    read_only: true
    ports:
      - "127.0.0.1:${SHIBUMI_PORT:-9100}:9100"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:9100/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
